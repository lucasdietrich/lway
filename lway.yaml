apps_dir: .
apps:
  - name: id-root
    command: /usr/bin/id
    oneshot: true
    restart:
      on_success:
        strategy: constant
        delay_ms: 1000
      on_error:
        strategy: constant
        delay_ms: 1000
      max_restart_attempts: 3
