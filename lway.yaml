apps_dir: .
apps:
  - name: app
    command: /var/amy/app 10
  - name: id-root
    command: /usr/bin/id
    oneshot: true
  - name: test1
    command: /var/amy/test -M 100
    cpu_weight: 100
  - name: test2
    command: /var/amy/test -M 100
    cpu_weight: 10
  - name: test3
    command: /var/amy/test -M 100
    cpu_weight: 5
    io_weight: 100
    user: www
    group: www
    workdir: /tmp
    env:
      MYVAR1: value1




