[package]
name = "lway"
version = "0.1.0"
edition = "2021"

[features]
default = []

[dependencies]
thiserror = "2.0"
slab = "0.4.12"
libc = "0.2.180"
mio = { version = "0.8", features = ["os-poll", "net", "os-ext"] }

# cgroups-rs = "0.5.1"
# pending PR https://github.com/kata-containers/cgroups-rs/pull/178
cgroups-rs = { git = "https://github.com/lucasdietrich/cgroups-rs.git", rev = "122b651e5eeea8952fe33534b357689914e48400"}

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

log = "0.4.29"
simple_logger = "5.1.0"

[dev-dependencies]

[build-dependencies]

# read https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
panic = "abort"
# strip = "none"
# codegen-units = 1      # better optimizations
debug = false
# opt-level = 1
# overflow-checks = true
# lto = false

[profile.release]
panic = "abort"
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"

# [patch.crates-io]
# cgroups-rs = { path = "/home/lucas/Projects/Embedded/cgroups-rs" }